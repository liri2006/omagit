<text x="1360" y="234.0" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#e0e6ed" xml:space="preserve">Amend | ✦ · Commit</text>
<rect x="40" y="276" width="1440" height="1" fill="#e0e6ed" fill-opacity="0.1"/>
<text x="40" y="294.0" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#4ecdc4" xml:space="preserve">S</text>
<text x="150" y="294.0" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#e0e6ed" xml:space="preserve">480–699</text>
<text x="300" y="294.0" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#e0e6ed" xml:space="preserve">single column, tabs</text>
<text x="500" y="294.0" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#e0e6ed" xml:space="preserve">repo icon · branch | toggle | ↓2 ↑1 ▾ · ⋯</text>
<text x="800" y="294.0" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#e0e6ed" xml:space="preserve">Changes 7 | Diff | History,</text>
<text x="800" y="310.0" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#e0e6ed" xml:space="preserve">centred</text>
